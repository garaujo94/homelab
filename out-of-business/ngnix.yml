apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: m-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/garaujo94/homelab"
    targetRevision: HEAD
    path: apps/nginx
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
