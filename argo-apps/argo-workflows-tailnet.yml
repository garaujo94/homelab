apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows-tailnet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/garaujo94/homelab"
    targetRevision: HEAD
    path: apps/argo-workflows
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
