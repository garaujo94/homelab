apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/argoproj/argo-workflows"
    targetRevision: v4.1.6
    path: manifests
    directory:
      include: quick-start-minimal.yaml # mesmo conteúdo do apply do release
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs somam ~12MB, acima do limite do apply client-side
