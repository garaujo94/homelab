apiVersion: v1
kind: Service
metadata:
  name: argo-server-tailnet
  namespace: argo
  annotations:
    tailscale.com/hostname: argo # -> argo.tailb0d602.ts.net
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale # L3: TCP puro, mantém o TLS do próprio argo-server
  selector:
    app: argo-server
  ports:
    - name: https
      port: 443
      targetPort: 2746
