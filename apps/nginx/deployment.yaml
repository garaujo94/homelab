apiVersion: apps/v1
kind: Deployment
metadata:
  name: m-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m-nginx
  template:
    metadata:
      labels:
        app: m-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80
