apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m-nginx
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  rules:
    - host: eniac
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m-nginx
                port:
                  number: 80
