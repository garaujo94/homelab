apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m-nginx
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
spec:
  ingressClassName: traefik
  rules:
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: m-nginx
              port:
                number: 80
