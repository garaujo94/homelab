apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m-nginx

spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - ng
      secretName: eniac-tls
  rules:
    - host: ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m-nginx
                port:
                  number: 80
