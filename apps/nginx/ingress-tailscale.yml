apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: m-nginx-tailscale
spec:
  ingressClassName: tailscale
  # o primeiro label de tls.hosts vira o device MagicDNS -> m-nginx.tailb0d602.ts.net
  tls:
    - hosts:
        - m-nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: m-nginx
                port:
                  number: 80
