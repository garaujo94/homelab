# Valores do subchart. Tudo abaixo de `jellyfin:` é passado para a dependency
# de mesmo nome; o resto é do wrapper (nenhum valor próprio por enquanto).
jellyfin:
  replicaCount: 1

  image:
    pullPolicy: IfNotPresent

  persistence:
    config:
      enabled: true
      size: 5Gi
      storageClass: ""
    media:
      enabled: true
      size: 100Gi
      storageClass: ""

  # O Ingress do wrapper (templates/ingress-tailscale.yaml) usa o padrão
  # tailscale do repo, então o Ingress do chart fica desligado.
  ingress:
    enabled: false

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}
